name: Validate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://forekast:forekast@127.0.0.1:5432/forekast
      JWT_SECRET: test-secret-that-is-long-enough-for-ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npm run generate --prefix server
      - run: npm run validate
